<head>

    <title>Our Team</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
        }

        header {
            background: #123c69;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd166;
        }

        .title {
            text-align: center;
            padding: 50px 20px;
        }

        .title h2 {
            color: #123c69;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .team {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 10px 8% 70px;
        }

        .member {
            background: white;
            width: 250px;
            text-align: center;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .member img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .member h3 {
            color: #123c69;
            margin-bottom: 8px;
        }

        .member p {
            color: #555;
        }

        footer {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media(max-width: 768px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

        }

    </style>
