<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Innovation Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8ff;
            color: #222;
        }

        header {
            background: #123c69;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd166;
        }

        .hero {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px 8%;
            background: linear-gradient(120deg, #e8f4ff, #ffffff);
        }

        .hero-text {
            width: 50%;
        }

        .hero-text h2 {
            font-size: 45px;
            color: #123c69;
            margin-bottom: 20px;
        }

        .hero-text p {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #123c69;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
        }

        .hero img {
            width: 45%;
            border-radius: 15px;
        }

        .section {
            padding: 50px 8%;
            text-align: center;
        }

        .section h2 {
            color: #123c69;
            margin-bottom: 30px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 280px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #123c69;
            margin-bottom: 10px;
        }

        footer {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media(max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .hero {
                flex-direction: column;
                text-align: center;
            }

            .hero-text {
                width: 100%;
            }

            .hero-text h2 {
                font-size: 35px;
            }

            .hero img {
                width: 90%;
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

         alt="Students working on project">

</section>
